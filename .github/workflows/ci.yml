name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint, type checks, and unit tests
        run: npm run check

      - name: Build the production application
        run: npm run build

  e2e:
    name: End-to-end
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      MONGODB_AUTH_DB: fleg_ci_auth
      MONGODB_APP_DB: fleg_ci_app
      MONGODB_MAX_POOL_SIZE: 10
      MONGODB_MAX_IDLE_TIME_MS: 5000
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: 5000
      MONGODB_CONNECT_TIMEOUT_MS: 10000
      HEALTH_CHECK_TIMEOUT_MS: 8000
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3100
      AUTH_ALLOW_SIGN_UP: false
      INVITATION_EMAIL_PROVIDER: manual

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed the disposable test databases
        run: npm run seed:demo

      - name: Run browser acceptance tests
        run: npm run test:e2e

      - name: Preserve browser diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
