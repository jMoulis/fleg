name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint, type checks, and unit tests
        run: npm run check

      - name: Build the production application
        run: npm run build

  e2e:
    name: End-to-end
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      MONGODB_URI: "mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=rs0"
      E2E_MONGODB_URI: "mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=rs0"
      MONGODB_AUTH_DB: fleg_ci_auth
      MONGODB_APP_DB: fleg_ci_app
      MONGODB_MAX_POOL_SIZE: 10
      MONGODB_MAX_IDLE_TIME_MS: 5000
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: 5000
      MONGODB_CONNECT_TIMEOUT_MS: 10000
      HEALTH_CHECK_TIMEOUT_MS: 8000
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3100
      AUTH_ALLOW_SIGN_UP: false
      INVITATION_EMAIL_PROVIDER: manual

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start a disposable MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name fleg-ci-mongodb \
            --publish 27017:27017 \
            --tmpfs /data/db:rw,noexec,nosuid,size=1g \
            mongo:8.0 --replSet rs0 --bind_ip_all

          for attempt in {1..30}; do
            if docker exec fleg-ci-mongodb mongosh --quiet \
              --eval 'db.adminCommand({ ping: 1 }).ok' | grep --quiet 1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs fleg-ci-mongodb
              exit 1
            fi
            sleep 2
          done

          docker exec fleg-ci-mongodb mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'

          for attempt in {1..30}; do
            if docker exec fleg-ci-mongodb mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' | grep --quiet true; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs fleg-ci-mongodb
              exit 1
            fi
            sleep 2
          done

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify storage persistence against real MongoDB
        env:
          STORAGE_TEST_MONGODB_URI: "mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=rs0"
        run: npm run test -- src/test/integration/storage-persistence.test.ts src/test/integration/inventory-sync-persistence.test.ts src/test/integration/private-storage-persistence.test.ts

      - name: Run browser acceptance tests
        run: npm run test:e2e

      - name: Preserve browser diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show MongoDB diagnostics after a failure
        if: failure()
        run: docker logs fleg-ci-mongodb
